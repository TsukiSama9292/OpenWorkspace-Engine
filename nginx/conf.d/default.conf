upstream kasm1_backend {
    server kasm:6901;
}

upstream kasm2_backend {
    server kasm2:6901;
}

server {
    listen 80;

    # --- Instance 1: /kasm1/ ---
    location /kasm1/ {
        proxy_pass https://kasm1_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_verify off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript;
        sub_filter '"path","websockify"' '"path","kasm1/websockify"';
        sub_filter 'value="websockify"' 'value="kasm1/websockify"';
    }

    location /kasm1/websockify {
        proxy_pass https://kasm1_backend/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # --- Instance 2: /kasm2/ ---
    location /kasm2/ {
        proxy_pass https://kasm2_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_verify off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript;
        sub_filter '"path","websockify"' '"path","kasm2/websockify"';
        sub_filter 'value="websockify"' 'value="kasm2/websockify"';
    }

    location /kasm2/websockify {
        proxy_pass https://kasm2_backend/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

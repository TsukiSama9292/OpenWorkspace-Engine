[package]
name = "openworkspace-api"
version = "0.1.0"
edition = "2024"
default-run = "openworkspace-api"

[features]
default = []
docker = []

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
bcrypt = "0.17"
bollard = "0.18"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
tar = "0.4"
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
migration = { path = "migration" }
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
async-trait = "0.1"
mockall = "0.13"
base64 = "0.22"
rand = "0.8"
rustix = { version = "1", features = ["fs", "process"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
postgres = "0.19"
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1"] }

upstream kasm1_backend {
    server kasm:6901;
}

upstream kasm2_backend {
    server kasm2:6901;
}

server {
    listen 80;

    # --- Static assets (SvelteKit build output) ---
    location /_app/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # --- Instance 1: /kasm1/ ---
    location /kasm1/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/index.html =404;
    }

    location = /kasm1/websockify {
        proxy_pass https://kasm1_backend/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # --- Instance 2: /kasm2/ ---
    location /kasm2/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/index.html =404;
    }

    location = /kasm2/websockify {
        proxy_pass https://kasm2_backend/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = / {
        return 404;
    }
}

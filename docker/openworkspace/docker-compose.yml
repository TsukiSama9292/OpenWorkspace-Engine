x-default-opts: &default-opts
  restart: unless-stopped
  tty: true
  stdin_open: true
  privileged: false
  ipc: private
  networks:
    - ow-network

services:
  traefik:
    image: traefik:v3.7.4
    container_name: ow-traefik
    <<: *default-opts
    # Routing is entirely file-provider driven: the API writes per-instance
    # route files into ./traefik/dynamic (mounted read-only here), so no Docker
    # socket or docker provider is needed.
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080" # dashboard (api.insecure), localhost-only
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro

  postgresql:
    image: postgres:18-alpine
    container_name: ow-postgres
    <<: *default-opts
    ports:
      - "55432:5432"
    environment:
      - TZ=Asia/Taipei
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - server-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: ow-web:latest
    container_name: ow-web
    <<: *default-opts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: ../../apps/api
    image: ow-api:latest
    container_name: ow-api
    <<: *default-opts
    # Host PID sharing + NET_ADMIN/SYS_ADMIN let the API reach the host and
    # instance network namespaces to apply tc/HTB bandwidth limits. It needs
    # rw access to the Docker socket to create/manage instance containers.
    # apparmor=unconfined: Docker's default profile denies setns(), which
    # nsenter needs to join the instance network namespace.
    pid: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - apparmor=unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared with traefik's /etc/traefik/dynamic: the API writes per-instance
      # route files here so traefik (file provider, watch) picks them up.
      - ./traefik/dynamic:/data/traefik/dynamic:rw
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@ow-postgres:5432/${POSTGRES_DB:-postgres}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - DOCKER_NETWORK=ow-network
      - TRAEFIK_DYNAMIC_DIR=/data/traefik/dynamic
    depends_on:
      postgresql:
        condition: service_healthy

networks:
  ow-network:
    external: true

volumes:
  server-pgdata:
